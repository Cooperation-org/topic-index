<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070b">
<title>Money Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
:root { color-scheme:dark; --space:#05070b; --glass:rgba(17,21,29,.78); --solid:#141923; --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.22); --text:#f0efec; --muted:#a9aeb6; --hover:rgba(255,255,255,.08); --out:#3987e5; --in:#d95926; --mark:#199e70; --accent:#6da7ec; --panel:390px; --r:14px; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--space); color:var(--text); font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
button, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--accent); }
#map { position:fixed; inset:0; background:var(--space); }
.glass { background:var(--glass); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 10px 40px rgba(0,0,0,.45); }
.icon { width:16px; height:16px; flex:none; background:currentColor; -webkit-mask:var(--i) center/contain no-repeat; mask:var(--i) center/contain no-repeat; display:inline-block; }

/* command bar */
#command { position:fixed; z-index:6; top:10px; left:10px; right:calc(var(--panel) + 20px); display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:none; transition:right .2s; }
body.closed #command { right:54px; }
#command > * { pointer-events:auto; }
#bar { width:min(720px,100%); position:relative; padding:3px 4px 3px 12px; }
#tokens { display:flex; flex-wrap:wrap; gap:4px; padding-top:4px; }
#tokens:empty { display:none; }
.token { display:inline-flex; align-items:center; gap:4px; padding:2px 4px 2px 9px; font-size:12.5px; background:rgba(109,167,236,.18); border:0; border-radius:999px; }
.token span { opacity:.7; padding:0 4px; }
.token:hover span { opacity:1; }
#input-row { display:flex; align-items:flex-end; gap:4px; }
#q { flex:1; min-width:0; background:none; border:0; outline:0; resize:none; font-size:15px; line-height:22px; padding:6px 0; max-height:160px; }
#q::placeholder { color:var(--muted); }
.round { width:34px; height:34px; flex:none; display:grid; place-items:center; background:none; border:0; border-radius:50%; color:var(--muted); }
.round:hover { background:var(--hover); color:var(--text); }
#send { background:var(--text); color:#0b0d11; }
#send:hover { background:#fff; color:#0b0d11; }
#send:disabled { opacity:.4; cursor:default; }
#mic[aria-pressed=true] { color:#fff; background:var(--in); }
#hits { position:absolute; left:0; right:0; top:calc(100% + 6px); background:var(--solid); border:1px solid var(--line); border-radius:var(--r); padding:6px; max-height:min(52dvh,420px); overflow:auto; box-shadow:0 14px 44px rgba(0,0,0,.6); }
#hits button { display:flex; gap:10px; align-items:center; width:100%; padding:8px 10px; background:none; border:0; border-radius:9px; text-align:left; }
#hits button.on, #hits button:hover { background:var(--hover); }
#hits small { color:var(--muted); margin-left:auto; white-space:nowrap; padding-left:12px; }
#hits .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* facets */
.facets { display:flex; gap:4px; max-width:100%; overflow-x:auto; scrollbar-width:none; padding:1px 18px 1px 1px; -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent); }
.facets::-webkit-scrollbar { display:none; }
.chip { display:inline-flex; align-items:center; gap:5px; flex:none; padding:4px 10px; min-height:28px; font-size:12.5px; font-weight:500; white-space:nowrap; background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:999px; }
.chip:hover { border-color:var(--line-strong); }
.chip.on { background:var(--text); color:#0b0d11; border-color:var(--text); }
.chip.dim { opacity:.45; }
.chip.small { padding:3px 9px; min-height:24px; font-size:12px; font-weight:400; }

/* site rail */
#rail { position:fixed; z-index:4; left:14px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:2px; padding:5px; }
#rail button { width:62px; padding:7px 2px 5px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; line-height:1.15; color:var(--muted); background:none; border:0; border-radius:10px; }
#rail button:hover { background:var(--hover); color:var(--text); }
#rail button.on { background:var(--text); color:#0b0d11; }
#rail .icon { width:18px; height:18px; }

/* time and legend */
#time { position:fixed; z-index:4; left:10px; right:calc(var(--panel) + 20px); bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:center; pointer-events:none; transition:right .2s; }
body.closed #time { right:10px; }
#time > div { width:min(720px,100%); pointer-events:auto; display:flex; align-items:center; gap:12px; padding:4px 10px; }
.seg { display:flex; padding:2px; background:rgba(255,255,255,.07); border-radius:9px; }
.seg button { padding:3px 10px; font-size:12.5px; font-weight:500; background:none; border:0; border-radius:7px; color:var(--muted); }
.seg button.on { color:#0b0d11; background:var(--text); }
#year-box { flex:1 1 180px; display:flex; align-items:center; gap:10px; min-width:150px; }
#year-label { font-weight:600; font-variant-numeric:tabular-nums; min-width:36px; }
#year { flex:1; min-width:60px; accent-color:var(--text); height:20px; }
#legend { flex:0 1 210px; font-size:11.5px; color:var(--muted); min-width:130px; }
#legend .ramp { height:6px; border-radius:3px; background:linear-gradient(to right,#123a6b,#1c5cab,#2a78d6,#5598e7); margin-bottom:2px; }
#legend .ends { display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; }

/* panel */
#panel { position:fixed; z-index:5; top:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); width:var(--panel); display:flex; flex-direction:column; overflow:hidden; transition:transform .22s; }
body.closed #panel { transform:translateX(calc(100% + 20px)); }
#open-panel { position:fixed; z-index:5; top:10px; right:10px; display:none; }
body.closed #open-panel { display:grid; }
#panel-head { display:flex; align-items:flex-start; gap:4px; padding:8px 6px 6px 14px; border-bottom:1px solid var(--line); }
#crumbs { flex:1; min-width:0; font-size:12px; color:var(--muted); }
#crumbs button, #sector-crumbs button { background:none; border:0; padding:0; color:var(--muted); font-size:12px; }
#crumbs button:hover, #sector-crumbs button:hover { color:var(--text); }
#crumbs b { display:block; font-size:17px; line-height:1.25; font-weight:650; color:var(--text); letter-spacing:-.01em; }
#sector-crumbs { margin-top:2px; font-size:12px; color:var(--muted); }
#scroll { flex:1; overflow-y:auto; padding:0 14px 14px; scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
h2 { font-size:12px; margin:14px 0 4px; font-weight:600; color:var(--muted); }
.turn { padding:10px 0; border-bottom:1px solid var(--line); }
.turn .me { font-weight:600; font-size:14.5px; white-space:pre-wrap; }
.steps { margin-top:8px; font-size:12.5px; color:var(--muted); }
.steps summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; }
.steps summary::-webkit-details-marker { display:none; }
.step { display:flex; gap:8px; padding:3px 0; align-items:baseline; }
.step i { width:7px; height:7px; flex:none; border-radius:50%; background:var(--accent); transform:translateY(-1px); animation:pulse 1.1s infinite; }
.step.done i { background:var(--mark); animation:none; }
.step.err i { background:var(--in); animation:none; }
.step em { font-style:normal; opacity:.75; margin-left:auto; white-space:nowrap; padding-left:8px; }
.step code { display:block; white-space:pre-wrap; font-size:11.5px; margin-top:3px; opacity:.8; }
@keyframes pulse { 50% { opacity:.3; } }
.answer { margin-top:8px; line-height:1.55; overflow-wrap:anywhere; }
.answer p { margin:0 0 8px; } .answer ul { margin:0 0 8px; padding-left:18px; }
.answer table { border-collapse:collapse; width:100%; font-size:12.5px; margin:6px 0 10px; display:block; overflow-x:auto; }
.answer td, .answer th { border-bottom:1px solid var(--line); padding:4px 8px 4px 0; text-align:left; }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:8px; }
.tile { padding:6px 9px; background:rgba(255,255,255,.05); border-radius:10px; }
.tile b { display:block; font-size:15px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.tile span { font-size:11.5px; color:var(--muted); line-height:1.25; display:block; }
.stats { display:grid; grid-template-columns:1fr auto; gap:3px 12px; font-size:12.5px; margin-top:8px; }
.stats span:nth-child(even) { text-align:right; font-variant-numeric:tabular-nums; }
.stats span:nth-child(odd) { color:var(--muted); }
details.more > summary { cursor:pointer; font-size:12.5px; color:var(--muted); margin-top:8px; }
.bar { position:relative; display:block; margin:1px 0; width:100%; height:25px; padding:0 7px; background:none; border:0; text-align:left; border-radius:5px; overflow:hidden; }
.bar:hover { background:var(--hover); }
.bar.plain { cursor:default; } .bar.plain:hover { background:none; }
.bar .t { position:absolute; inset:0 auto 0 0; border-radius:5px; background:var(--out); opacity:.3; min-width:2px; }
.bar.in .t { background:var(--in); }
.bar .l { position:relative; display:flex; justify-content:space-between; gap:12px; font-size:12.5px; line-height:25px; }
.bar .l span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar .l span:last-child { font-variant-numeric:tabular-nums; white-space:nowrap; }
.chips { display:flex; flex-wrap:wrap; gap:4px; }
.note { color:var(--muted); font-size:12.5px; margin-top:12px; }
#about { color:var(--muted); font-size:12px; margin-top:8px; }
#about summary { cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#foot { padding:5px 14px; border-top:1px solid var(--line); font-size:12px; }
.linkish { background:none; border:0; padding:0; color:var(--muted); font-size:12px; }
.linkish:hover { color:var(--text); }
#login { display:flex; gap:6px; margin-top:8px; }
#login input { flex:1; min-width:0; padding:8px 12px; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:9px; outline:0; }
.btn { padding:8px 14px; background:var(--text); color:#0b0d11; border:0; border-radius:9px; font-weight:500; }

/* sources */
#sources { position:fixed; inset:0; z-index:20; background:var(--space); overflow:auto; padding:16px 20px; display:none; }
#sources header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
#sources h1 { font-size:18px; margin:0; font-weight:650; }
#sources input { padding:8px 12px; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:9px; flex:1; max-width:420px; min-width:150px; outline:0; }
#sources table { border-collapse:collapse; width:100%; font-size:13px; }
#sources td, #sources th { border-bottom:1px solid var(--line); padding:6px 12px 6px 0; text-align:left; vertical-align:top; }
#sources th { position:sticky; top:-16px; background:var(--space); font-weight:600; color:var(--muted); }

.maplibregl-popup-content { background:var(--solid); color:var(--text); font-size:13px; border-radius:10px; padding:8px 11px; }
.maplibregl-popup-tip { display:none; }
.maplibregl-ctrl-attrib { background:rgba(0,0,0,.4) !important; font-size:10px; }
.maplibregl-ctrl-attrib a { color:var(--muted) !important; }

@media (max-width:820px) {
  #command { left:6px; right:6px !important; top:6px; }
  #measures { display:none; }
  #rail { top:auto; transform:none; left:6px; right:6px; bottom:calc(52px + env(safe-area-inset-bottom)); flex-direction:row; overflow-x:auto; scrollbar-width:none; background:none; border:0; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; padding:0; gap:4px; }
  #rail button { width:auto; flex:none; flex-direction:row; padding:5px 9px; font-size:12px; gap:4px; background:var(--glass); border-radius:999px; }
  #rail .icon { width:14px; height:14px; }
  #panel { top:auto; left:0; right:0; width:auto; bottom:0; height:52dvh; border-radius:var(--r) var(--r) 0 0; }
  body.closed #panel { transform:translateY(100%); }
  body:not(.closed) #time, body:not(.closed) #rail { display:none; }
  #open-panel { top:auto; bottom:calc(52px + env(safe-area-inset-bottom)); right:6px; z-index:6; }
  #time { left:6px; right:6px !important; bottom:calc(6px + env(safe-area-inset-bottom)); }
  body.closed #command { right:6px; }
  #legend { display:none; }
  #q { font-size:16px; }
}
@media (prefers-reduced-motion:reduce) { .step i { animation:none; } #panel, #command, #time { transition:none; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="command">
  <div id="bar" class="glass">
    <div id="tokens"></div>
    <div id="input-row">
      <textarea id="q" rows="1" placeholder="Ask, or find a place or sector" aria-label="Ask, or find a place or sector" autocomplete="off" enterkeyhint="send"></textarea>
      <button class="round" id="mic" type="button" aria-label="Speak" aria-pressed="false" hidden><span class="icon" data-icon="mic"></span></button>
      <button class="round" id="send" type="button" aria-label="Ask"><span class="icon" data-icon="arrow-up"></span></button>
    </div>
    <div id="hits" hidden></div>
  </div>
  <div class="facets" id="families" role="toolbar" aria-label="Data"></div>
  <div class="facets" id="measures" role="toolbar" aria-label="Measure" hidden></div>
</div>

<div id="rail" class="glass" role="toolbar" aria-label="Sites on the map"></div>

<div id="time"><div class="glass">
  <div class="seg" id="dir" role="group" aria-label="Direction">
    <button type="button" data-dir="out">Out</button><button type="button" data-dir="in">In</button>
  </div>
  <div id="year-box"><span id="year-label"></span><input id="year" type="range" aria-label="Year"></div>
  <div id="legend" hidden></div>
</div></div>

<button class="round glass" id="open-panel" type="button" aria-label="Open panel"><span class="icon" data-icon="panel-right"></span></button>
<aside id="panel" class="glass">
  <div id="panel-head">
    <div id="crumbs"></div>
    <button class="round" id="close-panel" type="button" aria-label="Close panel" style="width:32px;height:32px"><span class="icon" data-icon="x"></span></button>
  </div>
  <div id="scroll">
    <div id="thread"></div>
    <div id="sector-crumbs"></div>
    <div id="about"></div>
    <div id="body"></div>
  </div>
  <div id="foot"><button class="linkish" id="open-sources"></button></div>
</aside>
<div id="sources"></div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const LUCIDE = 'https://unpkg.com/lucide-static@0.460.0/icons/';
const iconHtml = n => '<span class="icon" style="--i:url(' + LUCIDE + n + '.svg)"></span>';
document.querySelectorAll('[data-icon]').forEach(e => e.style.setProperty('--i', 'url(' + LUCIDE + e.dataset.icon + '.svg)'));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
const RAMP = ['#123a6b','#184f95','#1c5cab','#256abf','#2a78d6','#3987e5','#5598e7'];
const SITES = {mine:['pickaxe','Mines'], power_plant:['zap','Power'], port:['anchor','Ports'], factory:['factory','Factories'], company:['building-2','Companies'], government:['landmark','Government'], lobbyist:['megaphone','Lobbyists'], ngo:['heart-handshake','NGOs']};
const KIND_NAMES = {power_plant:'Power plants', mine:'Mines', port:'Ports', factory:'Factories', company:'Companies', government:'Government', lobbyist:'Lobbyists', lobby_client:'Lobbying clients', ngo:'NGOs', project:'Projects', individual:'Consultants, by country'};
const FAMILIES = [['goods_trade','Goods','package'],['services_trade','Services','briefcase'],['investment','Investment','trending-up'],['banking','Banks','landmark'],['finance','Chinese finance','coins'],['aid','Aid','heart-handshake'],['debt','Debt','scale'],['remittances','Remittances','send'],['arms','Arms','shield'],['migration','Migration','users'],['freight','Freight','truck'],['output','Economy','chart-column'],['employment','Jobs','hard-hat'],['production','Production','wheat'],['energy','Energy','zap'],['waste','Waste','recycle'],['trade','Trade totals','arrow-left-right'],['fiscal','Tax','receipt'],['military','Military','shield-alert'],['demography','Population','users-round']];
if (innerWidth <= 820) document.body.classList.add('closed');
const state = {place:null, key:null, year:null, dir:'out', sector:null, kinds:new Set()};
let datasets = [], countries = {}, history = [], placeInfo = null, sectorInfo = null, entityTimer = null, lastValues = {}, renderId = 0, touched = false, arcsDraw = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (path, params) => {
  const u = new URL('api/' + path, location.href.split('#')[0]);
  Object.entries(params || {}).forEach(([k, v]) => { if (v !== null && v !== undefined && v !== '') u.searchParams.set(k, v); });
  const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json();
};
function fmt(v, unit) {
  if (v === null || v === undefined) return '';
  const a = Math.abs(v), s = a >= 1e12 ? (v/1e12).toFixed(a >= 1e13 ? 1 : 2) + 'T' : a >= 1e9 ? (v/1e9).toFixed(a >= 1e11 ? 0 : 1) + 'B' : a >= 1e6 ? (v/1e6).toFixed(a >= 1e8 ? 0 : 1) + 'M' : a >= 1e3 ? (v/1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K' : (a < 10 && a !== Math.floor(a) ? v.toFixed(2) : Math.round(v).toString());
  if (/^USD/.test(unit || '')) return '$' + s;
  return s + (unit ? ' ' + unit.replace(/_/g, ' ') : '');
}
const num = (v, unit) => fmt(v, /^USD/.test(unit || '') ? unit : '');
const unitNote = unit => /^USD$/.test(unit || '') ? '' : ' · ' + (unit || '').replace('USD_', '').replace(/_/g, ' ') + (/^USD_/.test(unit || '') ? ' dollars' : '');
const dkey = d => d.source_id + ':' + d.measure_id + ':' + d.kind;
const ds = () => datasets.find(d => dkey(d) === state.key);
const shortName = n => n.replace(/,? (current )?US\$$/, '').replace(/, USD$/, '').replace(/, exporter to importer$/, '');

// Globe
const map = new maplibregl.Map({container:'map', style:'https://tiles.openfreemap.org/styles/dark', center:[35, 18], zoom:Math.log2(Math.min(innerWidth - (innerWidth > 820 ? 390 : 0), innerHeight) / 512) + 1.42, attributionControl:false});
map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-left');
map.once('load', () => document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'));
const popup = new maplibregl.Popup({closeButton:false, closeOnClick:false, offset:10});
const emptyFC = {type:'FeatureCollection', features:[]};

function arcCoords(a, b) {
  const rad = Math.PI/180, deg = 180/Math.PI;
  const [lon1, lat1, lon2, lat2] = [a[0]*rad, a[1]*rad, b[0]*rad, b[1]*rad];
  const d = 2*Math.asin(Math.sqrt(Math.sin((lat2-lat1)/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin((lon2-lon1)/2)**2));
  if (!d) return [a, b];
  const out = []; let prev = null;
  for (let i = 0; i <= 48; i++) {
    const f = i/48, A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(lat1)*Math.cos(lon1) + B*Math.cos(lat2)*Math.cos(lon2), y = A*Math.cos(lat1)*Math.sin(lon1) + B*Math.cos(lat2)*Math.sin(lon2), z = A*Math.sin(lat1) + B*Math.sin(lat2);
    let lon = Math.atan2(y, x)*deg; const lat = Math.atan2(z, Math.sqrt(x*x+y*y))*deg;
    if (prev !== null) { while (lon - prev > 180) lon -= 360; while (lon - prev < -180) lon += 360; }
    prev = lon; out.push([lon, lat]);
  }
  return out;
}

// Dashes that travel along each arc, in the direction of the flow.
const DASHES = [[0,4,3],[.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,.5],[3,4,0],[0,.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,.5]];
function animateArcs() {
  if (calm) return;
  let step = -1;
  const tick = t => {
    const s = Math.floor(t/70) % DASHES.length;
    if (s !== step && map.getLayer('arcs')) { step = s; map.setPaintProperty('arcs', 'line-dasharray', DASHES[s]); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function spin() {
  if (calm) return;
  const tick = () => {
    if (touched) return;
    const c = map.getCenter(); c.lng -= .035; map.setCenter(c);

  const values = await api('map', {source:d.source_id, measure:d.measure_id, year:state.year, kind:d.kind, dir:state.dir, sector:state.sector});
  lastValues = {};

  map.getSource('bubbles').setData({type:'FeatureCollection', features:below.map(r => ({type:'Feature', geometry:{type:'Point', coordinates:[r.lon, r.lat]}, properties:{id:r.id, name:r.name, value:r.value, r:3 + 17*Math.sqrt(r.value/topBelow)}}))});

    const r = await api('search', {q:t}), low = t.toLowerCase();
    const place = r.places.find(p => p.name.toLowerCase() === low), sector = r.sectors.find(s => s.name.toLowerCase() === low);
    if (place || sector) {
      $('hits').hidden = true; qEl.value = ''; grow();
      if (place) { openPanel(); select(place.id); } else pickSector(sector.id, sector.scheme);
      return;
    }
  }
  submitAsk();
}
async function pickSector(id, scheme) {
  touched = true;
  state.sector = id;
  const match = await api('datasets_for_scheme', {scheme});
  if (match.length && !match.includes(state.key)) {
    const best = datasets.filter(d => match.includes(dkey(d))).sort(preferred)[0];
    if (best) setDataset(dkey(best));
  }
  render();
}
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); qEl.focus(); } });
$('hits').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  e.stopPropagation();
  $('hits').hidden = true; qEl.value = ''; grow();
  if (b.dataset.hitPlace) { openPanel(); select(+b.dataset.hitPlace); }
  else pickSector(+b.dataset.hitSector, b.dataset.scheme);
};
$('send').onclick = () => enterText();

// Ask: steps and words appear as the agent works.
async function submitAsk(retry) {
  const question = retry || qEl.value.trim(); if (!question) return;
  touched = true; openPanel();
  $('hits').hidden = true; qEl.value = ''; grow();
  const turn = document.createElement('div'); turn.className = 'turn';
  turn.innerHTML = '<div class="me">' + esc(question) + '</div><details class="steps" open><summary></summary><div class="list"></div></details><div class="answer"></div>';
  const prior = document.querySelector('#thread .turn.pending-login'); prior?.remove();
  $('thread').appendChild(turn); turn.scrollIntoView({block:'start', behavior:calm ? 'auto' : 'smooth'});
  const list = turn.querySelector('.list'), ans = turn.querySelector('.answer'), det = turn.querySelector('.steps'), sum = det.querySelector('summary');
  const steps = {}; let live = '', count = 0, last = 0, final = null;
  const draw = () => { ans.innerHTML = DOMPurify.sanitize(marked.parse(final ?? live)); ans.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; }); };
  sum.textContent = 'Working';
  $('send').disabled = true;
  try {
    const r = await fetch('api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question, history})});
    if (r.status === 401) { turn.classList.add('pending-login'); det.remove(); showLogin(ans, question); return; }
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const e = JSON.parse(line);
        if (e.type === 'text') { live += e.text; if (Date.now() - last > 90) { last = Date.now(); draw(); } }
        else if (e.type === 'step') {
          live = ''; ans.innerHTML = '';
          count++; sum.textContent = e.label;
          const s = document.createElement('div'); s.className = 'step';
          s.innerHTML = '<i></i><div style="flex:1;min-width:0">' + esc(e.label) + (e.detail ? '<details><summary>SQL</summary><code>' + esc(e.detail) + '</code></details>' : '') + '</div><em></em>';
          list.appendChild(s); steps[e.id] = s;
        }
        else if (e.type === 'step_done') { const s = steps[e.id]; if (s) { s.classList.add(e.result.startsWith('error') ? 'err' : 'done'); s.querySelector('em').textContent = e.result.slice(0, 40); } }
        else if (e.type === 'map') showAnswerMap(e.map || {});
        else if (e.type === 'answer') { final = e.text; draw(); }
      }
    }
    if (final === null) { final = live || 'No answer.'; draw(); }
    history.push([question, final]);
    if (count) { det.open = false; sum.textContent = count + (count === 1 ? ' step' : ' steps'); } else det.remove();
  } catch (err) {
    ans.textContent = 'Failed: ' + err.message; det.open = false;
  } finally { $('send').disabled = false; }
}
function showLogin(box, question) {
  box.innerHTML = '<form id="login"><input id="pw" type="password" placeholder="Team password" aria-label="Team password" autocomplete="current-password"><button class="btn">Sign in</button></form><div class="note" id="login-note" hidden></div>';
  $('send').disabled = false;
  $('login').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch('api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:$('pw').value})});
    if (r.ok) submitAsk(question); else { $('login-note').hidden = false; $('login-note').textContent = 'Wrong password'; }
  };
  $('pw').focus();
}
function showAnswerMap(m) {
  const feats = [], pts = [];
  (m.places || []).forEach(p => { if (p.lat !== null) { feats.push({type:'Feature', geometry:{type:'Point', coordinates:[p.lon, p.lat]}, properties:{label:p.label ? p.name + ': ' + p.label : p.name}}); pts.push([p.lon, p.lat]); } });
  (m.points || []).forEach(p => { feats.push({type:'Feature', geometry:{type:'Point', coordinates:[p.lon, p.lat]}, properties:{label:p.label || ''}}); pts.push([p.lon, p.lat]); });
  map.getSource('marks').setData({type:'FeatureCollection', features:feats});
  if (m.flows?.length) {
    const max = Math.max(...m.flows.map(f => f.value || 1), 1);
    map.getSource('arcs').setData({type:'FeatureCollection', features:m.flows.filter(f => f.from.lat !== null && f.to.lat !== null).map(f => { pts.push([f.from.lon, f.from.lat], [f.to.lon, f.to.lat]); return {type:'Feature', geometry:{type:'LineString', coordinates:arcCoords([f.from.lon, f.from.lat], [f.to.lon, f.to.lat])}, properties:{color:css('--mark'), width:1 + 5*Math.sqrt((f.value || 1)/max)}}; })});
  }
  const padding = innerWidth > 820 ? {top:130, bottom:90, left:90, right:420} : {top:120, bottom:innerHeight*.5, left:30, right:30};
  if (pts.length > 1) { const b = new maplibregl.LngLatBounds(pts[0], pts[0]); pts.forEach(p => b.extend(p)); map.fitBounds(b, {padding, maxZoom:6}); }
  else if (pts.length) map.flyTo({center:pts[0], zoom:5});
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  $('mic').hidden = false;
  $('mic').onclick = () => {
    const rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = true;
    $('mic').setAttribute('aria-pressed', 'true');
    rec.onresult = e => { const r = e.results[e.results.length-1]; qEl.value = r[0].transcript; grow(); if (r.isFinal) submitAsk(); };
    rec.onend = () => $('mic').setAttribute('aria-pressed', 'false');
    rec.start();
  };
}

// Sources
$('open-sources').onclick = async () => {
  const list = await api('sources');
  const box = $('sources'); box.style.display = 'block';
  box.innerHTML = '<header><h1>Sources</h1><input id="source-find" placeholder="Filter" aria-label="Filter sources"><div class="chips" id="source-status"></div><button class="btn" id="close-sources" style="margin-left:auto">Close</button></header><table><thead><tr><th>Status</th><th>Name</th><th>Holds</th><th>Coverage</th><th>Access</th><th>Rows</th><th>Note</th></tr></thead><tbody></tbody></table>';
  let status = '', q = '';
  const statuses = [...new Set(list.map(s => s.status))];
  const draw = () => {
    $('source-status').innerHTML = statuses.map(s => '<button class="chip small' + (s === status ? ' on' : '') + '" data-s="' + s + '">' + s + ' ' + list.filter(x => x.status === s).length + '</button>').join('');
    box.querySelector('tbody').innerHTML = list.filter(s => (!status || s.status === status) && (!q || (s.name + ' ' + (s.about || '') + ' ' + (s.publisher || '')).toLowerCase().includes(q))).map(s => '<tr><td>' + esc(s.status) + '</td><td>' + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a>' : esc(s.name)) + '</td><td>' + esc(s.about) + '</td><td>' + esc(s.coverage) + '</td><td>' + esc(s.access) + '</td><td>' + (s.row_count ? s.row_count.toLocaleString() : '') + '</td><td>' + esc(s.status_note) + '</td></tr>').join('');
  };
  draw();
  $('source-find').oninput = e => { q = e.target.value.toLowerCase(); draw(); };
  $('source-status').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { status = status === b.dataset.s ? '' : b.dataset.s; draw(); } };
  $('close-sources').onclick = () => box.style.display = 'none';
};

// The address holds the view, so a view can be shared.
function writeHash() {
  const p = new URLSearchParams(), d = ds();
  if (state.place) p.set('place', state.place);
  if (d) { p.set('source', d.source); p.set('measure', d.measure); p.set('kind', d.kind); }
  if (state.year) p.set('year', state.year);
  if (state.dir !== 'out') p.set('dir', state.dir);
  if (state.sector) p.set('sector', state.sector);
  if (state.kinds.size) p.set('sites', [...state.kinds].join(','));
  window.history.replaceState(null, '', '#' + p);
}

async function init() {
  [datasets] = await Promise.all([api('datasets'), api('countries').then(c => c.forEach(x => countries[x.iso3] = x))]);
  const srcs = await api('sources');
  $('open-sources').textContent = srcs.filter(s => s.status === 'loaded').length + ' sources loaded, ' + srcs.filter(s => s.status === 'listed').length + ' listed';
  const kinds = await api('entity_kinds');
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('place')) { state.place = +h.get('place'); touched = true; }
  if (h.get('dir')) state.dir = h.get('dir');
  if (h.get('sector')) state.sector = +h.get('sector');
  if (h.get('year')) state.year = +h.get('year');
  (h.get('sites') || '').split(',').filter(Boolean).forEach(k => state.kinds.add(k));
  $('rail').innerHTML = kinds.filter(k => k.with_coords).map(k => { const s = SITES[k.kind] || ['map-pin', k.kind]; return '<button data-site="' + esc(k.kind) + '" aria-pressed="' + state.kinds.has(k.kind) + '" class="' + (state.kinds.has(k.kind) ? 'on' : '') + '">' + iconHtml(s[0]) + esc(s[1]) + '</button>'; }).join('');
  const fromHash = datasets.find(d => d.source === h.get('source') && d.measure === h.get('measure') && d.kind === h.get('kind'));
  const start = fromHash || bestInFamily('goods_trade') || datasets[0];
  if (start) setDataset(dkey(start));
  await render();
  loadEntities();
  if (state.place && placeInfo?.lat != null) map.jumpTo({center:[placeInfo.lon, placeInfo.lat], zoom:{country:3.4, admin1:5.5, admin2:7, city:9}[placeInfo.kind] || 2});
}
