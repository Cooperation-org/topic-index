      - "{sector} venture fund investment thesis"
      - "{sector} impact fund what we invest in"
  - values:
      region: [Africa, East Africa, West Africa, Nigeria, Kenya, South Africa, Latin America, Mexico, Brazil,
               Colombia, Argentina, Chile, India, Southeast Asia, Indonesia, Philippines, Vietnam, Pakistan,
               Bangladesh, Middle East, Europe, Nordics, Germany, France, United Kingdom, Eastern Europe,
               Ukraine, Canada, US Southwest, Arizona, US Midwest, Appalachia]
    templates:
      - "{region} early stage venture fund investment thesis"
      - "{region} impact investment fund criteria"
